name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Prepare app folder
        run: |
          mkdir -p app/www app/android-src
          cp *.html *.js *.webmanifest *.png app/www/ 2>/dev/null || true
          cp MusicNativePlugin.java PlaybackService.java android_setup.py app/android-src/
          cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          echo '{"appId":"com.sandeep.sp03","appName":"SP03 Music","webDir":"www","android":{"allowMixedContent":true}}' > capacitor.config.json
          npx cap add android
          python3 android-src/android_setup.py
          npx cap sync android

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SP03-Music.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" SP03-Music.apk \
            --title "SP03 Music Android (build ${{ github.run_number }})" \
            --notes "Install: download SP03-Music.apk, open it, allow 'Install unknown apps', then allow music and notification access. All songs on the phone appear automatically and keep playing with the screen off." \
            --latest
